<body data-sveltekit-preload-data="hover" style="height:100%">
<script>window.addEventListener('error',e=>{if(/ResizeObserver loop/.test(e.message))e.stopImmediatePropagation()})</script>

<div id="pre-hydrate-bar" style="position:fixed;top:0;left:0;right:0;z-index:9999;pointer-events:none;">
<div style="height:4px;background:transparent;overflow:hidden;">
<div id="pre-hydrate-fill" style="height:100%;width:0%;background:#333;transition:width 200ms ease;position:relative;">
<div style="position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.3) 50%,transparent 100%);animation:pre-shimmer 1.5s infinite;"></div>
</div>
</div>
<div id="pre-hydrate-text" style="font-size:11px;padding:2px 8px 4px;line-height:1;letter-spacing:0.01em;color:#666;">Loading OpenTrail...</div>
</div>

<script>
(function(){
var bar=document.getElementById('pre-hydrate-fill');
var txt=document.getElementById('pre-hydrate-text');
if(!bar||!txt)return;
var total=window.__CHUNK_COUNT||0;
var seen=0;
var seenUrls={};
function update(){
if(total>0){
bar.style.width=Math.round((seen/total)*100)+'%';
txt.textContent='Loading OpenTrail... '+Math.round((seen/total)*100)+'%';
}else{
bar.style.width='0%';
}
}
function checkBuffered(){
if(!performance||!performance.getEntriesByType)return;
var entries=performance.getEntriesByType('resource');
for(var i=0;i<entries.length;i++){
var n=entries[i].name;
if(n.indexOf('/_app/immutable/')!==-1&&!seenUrls[n]){
seenUrls[n]=1;
seen++;
}
}
update();
}
if(typeof PerformanceObserver!=='undefined'){
try{
var obs=new PerformanceObserver(function(list){
var entries=list.getEntries();
for(var i=0;i<entries.length;i++){
var n=entries[i].name;
if(n.indexOf('/_app/immutable/')!==-1&&!seenUrls[n]){
seenUrls[n]=1;
seen++;
}
}
update();
if(total>0&&seen>=total)obs.disconnect();
});
obs.observe({type:'resource',buffered:true});
	}catch(e){
			checkBuffered();
		}
	}else{
		checkBuffered();
	}
	var pollInterval=setInterval(function(){
		checkBuffered();
		if(total>0&&seen>=total)clearInterval(pollInterval);
	},200);
	setTimeout(function(){clearInterval(pollInterval)},8000);
	})();
</script>

<div style="display: contents">%sveltekit.body%</div>
</body>
