# fly.toml app configuration file for the OpenTrail staging environment.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'opentrail-staging'
primary_region = 'ord'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[env]
  PORT = '8080'
  PUBLIC_IS_STAGING = 'true'
  SITE_URL = 'https://dev.opentrail.org'

[experimental]
  auto_rollback = true

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[deploy]
  release_command = "npx prisma migrate deploy"

[build]
  dockerfile = "Dockerfile"
